# Builds Lockbox for Android on every push to main, runs the tests, and
# publishes a numbered release (v1.0.<build number>) on the repository's
# Releases page. Obtainium watches these releases to update the Android app.
# The 5 newest releases are kept, plus the newest release that has a
# Windows download (never deleted, however old).
#
# Windows is built only on request, to save GitHub Actions minutes (Windows
# minutes count double): put "[windows]" in the commit message, or start the
# workflow by hand (Actions > Build > Run workflow).
#
# Android signing: add two repository secrets (Settings > Secrets and
# variables > Actions):
#   ANDROID_KEYSTORE_BASE64  - the signing key file, base64 encoded
#   ANDROID_KEY_PASSWORD     - its password
# Without them a TEST-ONLY build is produced (see README).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time: a new build waits for the running one to finish
# (each build creates and cleans up draft releases).
concurrency:
  group: build
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.9"
  VERSION: "1.0.${{ github.run_number }}"
  BUILD_NUMBER: "${{ github.run_number }}"

jobs:
  # Creates a draft release; the app jobs upload straight into it (no
  # GitHub artifact storage, which has a small quota). Published at the end
  # only if everything succeeded.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # remove drafts left by earlier failed builds
          gh release list --limit 50 --json tagName,isDraft --jq '.[]|select(.isDraft)|.tagName' |
          while read -r tag; do gh release delete "$tag" -y || true; done
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Lockbox $VERSION" \
            --notes "Built automatically from commit ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC')."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart run webcrypto:setup
      - run: flutter test

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # 64-bit ARM only (every phone from the last 6+ years). Including the
      # 32-bit and x86 copies tripled the size of the app for no benefit.
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/lockbox-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=lockbox\nstoreFile=lockbox-release.jks\n' \
              "$PASSWORD" "$PASSWORD" > android/key.properties
            echo "name=Lockbox-android.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key secrets set - building a TEST-ONLY APK."
            echo "name=Lockbox-android-TEST-ONLY.apk" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter pub get
      - run: >
          flutter build apk --release --target-platform android-arm64
          --build-name=$VERSION --build-number=$BUILD_NUMBER
          --dart-define=LOCKBOX_VERSION=$VERSION
      - run: cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.key.outputs.name }}"
      - run: rm -f android/key.properties android/app/lockbox-release.jks
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "${{ steps.key.outputs.name }}" --clobber

  windows:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build windows --release
          --build-name=${{ env.VERSION }} --build-number=${{ env.BUILD_NUMBER }}
          --dart-define=LOCKBOX_VERSION=${{ env.VERSION }}
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Lockbox-windows.zip
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" Lockbox-windows.zip --clobber

  release:
    needs: [test, android, windows]
    if: always() && needs.test.result == 'success' && needs.android.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false --latest
      - name: Keep the 5 newest releases and the latest Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft | not)] | sort_by(.created_at) | reverse' > releases.json
          # The newest release that has a Windows download is never deleted.
          keep_windows=$(jq -r '[.[] | select(any(.assets[]; .name == "Lockbox-windows.zip"))][0].tag_name // ""' releases.json)
          echo "Keeping latest Windows release: ${keep_windows:-none}"
          jq -r '.[5:][].tag_name' releases.json | while read -r tag; do
            if [ "$tag" = "$keep_windows" ]; then continue; fi
            gh release delete "$tag" --cleanup-tag -y
          done
