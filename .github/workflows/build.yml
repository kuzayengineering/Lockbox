# Builds Lockbox for Android and Windows on every push to main, runs the
# tests, and publishes the files on the repository's Releases page as
# "Latest build".
#
# Android signing: add two repository secrets (Settings > Secrets and
# variables > Actions):
#   ANDROID_KEYSTORE_BASE64  - the signing key file, base64 encoded
#   ANDROID_KEY_PASSWORD     - its password
# Without them a TEST-ONLY build is produced (see README).
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart run webcrypto:setup
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            echo "$KEYSTORE" | base64 -d > android/app/lockbox-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=lockbox\nstoreFile=lockbox-release.jks\n' \
              "$PASSWORD" "$PASSWORD" > android/key.properties
            echo "name=Lockbox-android.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key secrets set - building a TEST-ONLY APK."
            echo "name=Lockbox-android-TEST-ONLY.apk" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk "${{ steps.key.outputs.name }}"
      - run: rm -f android/key.properties android/app/lockbox-release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: Lockbox-android
          path: ${{ steps.key.outputs.name }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Lockbox-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lockbox-windows
          path: Lockbox-windows.zip

  release:
    needs: [test, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish "Latest build"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --cleanup-tag -y || true
          gh release create latest-build Lockbox-android*.apk Lockbox-windows.zip \
            --prerelease --title "Latest build" \
            --notes "Built automatically from commit ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC')."
